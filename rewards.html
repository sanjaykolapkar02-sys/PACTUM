 },

 challengeCard(c){return `<article class="challenge-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="badge">${this.esc(c.category)}</span><span class="muted small">${c.duration} days</span></div><h3>${this.esc(c.title)}</h3><p>${this.esc(c.description)}</p><div class="challenge-meta"><div><small>Stake per person</small><b>${this.money(c.stake)}</b></div><div><small>Participants</small><b>${c.participants}</b></div><div><small>Current pool · demo</small><b>${this.money(c.pool)}</b></div><div><small>Completion</small><b>${c.progress?Math.round(c.progress/c.duration*100)+'%':'Not started'}</b></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px"><span class="small muted">Ends ${this.esc(c.end||'Date not set')}</span>${this.badge(c.status||'Active')}</div><a class="btn" href="challenge-details.html?id=${encodeURIComponent(c.id)}">View Details</a></article>`},
 allChallenges(){return this.seed().challenges},

 render(){

 },

 landing(){document.body.innerHTML=`<div class="landing"><nav class="landing-nav"><a class="brand" href="index.html" style="padding:0;border:0;margin:0"><span class="brand-mark">CP</span><span><b>CommitmentPool</b><small>Accountability on-chain</small></span></a><div class="landing-links"><a href="#how">How it works</a><a href="challenges.html">Explore</a><a href="login.html">Log in</a><a href="signup.html" class="btn">Get started</a></div></nav><section class="landing-hero"><div class="eyebrow">A calmer way to stay accountable · Monad Testnet demo</div><h1>Make commitments<br>worth keeping.</h1><p>Turn your personal goals into accountable commitments with transparent, stake-based challenges on Monad. Choose a goal, put a stake behind it, and show your progress.</p><div class="hero-actions"><a class="btn" href="challenges.html">Explore Challenges</a><a class="btn secondary" href="create-challenge.html">Create Your Commitment</a><a class="btn ghost" href="login.html">Log In</a></div><div class="hero"><div><div class="eyebrow">Small promises. Real follow-through.</div><h2>Progress feels different when you commit.</h2><p>CommitmentPool is designed around accountability, evidence, and clear settlement—not speculation. This interactive prototype uses demo data only.</p><div class="hero-actions"><a class="btn" href="signup.html">Start your demo</a><a class="btn secondary" href="support.html">Understand the rules</a></div></div><div class="hero-art"><div class="float-chip chip-one">✓ Evidence workflow</div><div class="floating-card"><div class="coin">MON</div><h3>30-Day Coding Sprint</h3><p>Learning & Productivity</p><div style="margin-top:15px;color:var(--muted);font-size:10px">Illustrative stake</div><b style="font-size:19px">1 MON</b></div><div class="float-chip chip-two">Demo mode · No real funds</div></div></div></section><section id="how" class="section"><div class="eyebrow">How it works</div><h2>Four clear steps. One meaningful commitment.</h2><p>Each stage is visible so you know what happens next.</p><div class="three-steps"><div class="step-card"><span class="step-num">01</span><b>Choose a goal</b><p>Explore health, learning, and personal-goal challenges.</p></div><div class="step-card"><span class="step-num">02</span><b>Commit a stake</b><p>Review the amount, network, and rules before joining.</p></div><div class="step-card"><span class="step-num">03</span><b>Submit evidence</b><p>Record progress and follow the displayed verification state.</p></div></div></section><section class="section"><div class="eyebrow">Explore the catalogue</div><h2>Find a challenge that fits your life.</h2><div class="challenge-grid">${this.allChallenges().slice(0,3).map(c=>this.challengeCard(c)).join('')}</div><div style="margin-top:16px"><a class="btn secondary" href="challenges.html">Browse all six challenges</a></div></section><section class="section"><div class="panel"><div class="eyebrow">The staking model</div><h2>Clarity before commitment.</h2><p class="muted">Successful participants receive their original stake back. Failed participants' stakes may be redistributed among successful finishers according to the final contract rules. Reward figures shown here are illustrative—not guaranteed profit.</p><a class="btn" href="settlement.html">See settlement example</a></div></section><footer class="footer"><span>© CommitmentPool · Prototype</span><span><a href="support.html">Support</a> · <a href="login.html">Log in</a> · Monad Testnet demo</span></footer></div><div id="modalRoot" class="modal-backdrop"><div class="modal"></div></div><div id="toast" class="toast"></div>`;this.bindGlobal()},
 auth(kind){const signup=kind==='signup';document.body.innerHTML=`<div class="auth-wrap"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">CP</span><span><b>CommitmentPool</b><small>Accountability on-chain</small></span></a><div class="eyebrow">${signup?'Join the community':'Welcome back'}</div><h1>${signup?'Create your account':'Welcome back'}</h1><p>${signup?'Create a demo account first. Wallet connection happens after login.':'Log in to continue your commitment journey.'}</p><form id="authForm">${signup?'<div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name" placeholder="Your name"></div>':''}<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="6" autocomplete="${signup?'new-password':'current-password'}" placeholder="At least 6 characters"></div>${signup?'<div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" required minlength="6" placeholder="Repeat password"></div><label class="checkline"><input type="checkbox" id="terms" required> I understand this is a demo prototype and not secure production authentication.</label>':''}<button class="btn" style="width:100%;margin-top:18px" type="submit">${signup?'Create demo account':'Log in'}</button></form><button class="btn secondary" id="demoLogin" style="width:100%;margin-top:12px">Continue with demo account</button><div class="auth-footer">${signup?'Already have an account? <a href="login.html">Log in</a>':'New here? <a href="signup.html">Create an account</a>'}<p><a href="index.html">← Back to home</a></p></div><div class="notice warning">Demo only: account details are stored in this browser. Do not use a real password.</div></div></div><div id="toast" class="toast"></div>`;document.getElementById('authForm').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),email=fd.get('email'),password=fd.get('password');if(signup){if(password!==fd.get('confirm'))return this.toast('Passwords do not match.');let user={name:fd.get('name'),email};localStorage.setItem(this.keys.user,JSON.stringify(user));this.log('Demo account created','Account created for '+email,'DEMO-AUTH');location.href='dashboard.html'}else{let saved=this.user();if(saved&&saved.email.toLowerCase()!==String(email).toLowerCase())return this.toast('This demo account uses '+saved.email+'. Use demo login or sign up again.');localStorage.setItem(this.keys.user,JSON.stringify(saved||{name:'Sujal',email}));this.log('Logged in','Demo authentication completed.','DEMO-LOGIN');location.href='dashboard.html'}});document.getElementById('demoLogin').onclick=()=>{if(!this.user())localStorage.setItem(this.keys.user,JSON.stringify({name:'Sujal',email:'sujal@example.com'}));this.log('Demo login','Entered the demo workspace.','DEMO-LOGIN');location.href='dashboard.html'}},
 dashboard(){let d=this.seed(),j=d.joined,user=this.user()||{name:'Sujal'};let active=j.filter(x=>x.status==='Active'||x.status==='Joined');let total=active.reduce((a,x)=>a+Number(x.stake||0),0);let content=`<section class="hero"><div><div class="eyebrow">Good afternoon, ${this.esc((user.name||'Sujal').split(' ')[0])}</div><h2>Make commitments worth keeping.</h2><p>Stay accountable. Keep your commitments visible, submit evidence, and understand settlement before it happens.</p><div class="hero-actions"><a class="btn" href="challenges.html">Explore Challenges</a><a class="btn secondary" href="create-challenge.html">Create Commitment</a></div></div><div class="hero-art"><div class="float-chip chip-one">✓ Evidence workflow</div><div class="floating-card"><div class="coin">MON</div><h3>Daily Coding</h3><p>Accountability stake</p><div style="margin-top:15px;color:var(--muted);font-size:10px">Demo pool</div><b style="font-size:19px">12 MON</b></div><div class="float-chip chip-two">Monad Testnet · Demo</div></div></section>${this.stats([['ACTIVE CHALLENGES',active.length,'Challenges you joined'],['TOTAL STAKED',this.money(total),'Demo stake records'],['COMPLETED',j.filter(x=>x.status==='Completed').length,'Verified demo commitments'],['ADDITIONAL REWARDS',this.money(d.rewards.reduce((a,r)=>a+r.additional,0)),'Separate from returned stakes']])}<div class="layout-2"><section class="panel"><div class="panel-head"><h2>Your Active Commitments</h2><a class="small" href="my-challenges.html">View all →</a></div>${active.length?active.slice(0,4).map(x=>{let c=this.challengeById(x.challengeId);return `<div class="commitment"><div class="category-icon">${c.icon||'◈'}</div><div><h3>${this.esc(c.title)}</h3><p>${this.esc(c.category)} · ${this.money(x.stake)} stake</p><div class="progress"><span style="width:${Math.min(100,(x.progress||0)/c.duration*100)}%"></span></div><div class="progress-line"><span>${x.progress||0} / ${c.duration} days recorded</span><span>${Math.round((x.progress||0)/c.duration*100)}%</span></div></div><a class="btn small secondary" href="challenge-details.html?id=${c.id}">View</a></div>`}).join(''):'<div class="empty"><b>No active commitments yet</b>Explore challenges and join your first commitment.<a class="btn" href="challenges.html" style="display:inline-block;margin-top:12px">Explore Challenges</a></div>'}</section><div><section class="panel"><div class="panel-head"><h3>Pool overview</h3><span class="small muted">Illustrative</span></div><div class="pool-layout"><div class="ring"><div class="ring-inner"><b>10 MON</b><small>EXAMPLE POOL</small></div></div><div class="metric-list"><div class="metric-row"><span>Your demo stakes</span><b>${this.money(total)}</b></div><div class="metric-row"><span>Joined challenges</span><b>${j.length}</b></div><div class="metric-row"><span>Wallet</span><b>${this.wallet()==='connected'?'Connected':'Not connected'}</b></div><div class="metric-row"><span>Network</span><b>Monad Testnet</b></div></div></div><div class="notice">Pool figures are demo values. Additional rewards depend on the final settlement rules.</div></section><section class="panel"><div class="panel-head"><h3>Recent Activity</h3><a class="small" href="activity.html">View all</a></div>${d.activity.slice(0,4).map(a=>`<div class="activity-row"><span class="activity-icon">↗</span><div><b>${this.esc(a.title)}</b><p>${this.esc(a.desc)}</p></div><time>${new Date(a.time).toLocaleDateString()}</time></div>`).join('')}</section></div></div><section class="section"><div class="panel-head"><h2>Recommended for you</h2><a class="small" href="challenges.html">Explore all →</a></div><div class="challenge-grid">${d.challenges.slice(0,3).map(c=>this.challengeCard(c)).join('')}</div></section>`;return content},
 explore(){return `<section class="page-intro"><h2>Find commitments worth keeping.</h2><p>Browse the initial demo catalogue across health, learning, and personal goals.</p></section><div class="toolbar"><input id="searchChallenges" placeholder="Search challenge name or description..." aria-label="Search challenges"><select id="categoryFilter"><option value="">All categories</option><option>Health & Fitness</option><option>Learning & Productivity</option><option>Personal Goals</option></select><select id="durationFilter"><option value="">Any duration</option><option value="7">7 days</option><option value="14">14 days</option><option value="21">21 days</option><option value="30">30 days</option></select><select id="stakeFilter"><option value="">Any stake</option><option value="0.5">Up to 0.5 MON</option><option value="0.75">Up to 0.75 MON</option><option value="1">Up to 1 MON</option></select><select id="sortFilter"><option value="newest">Newest</option><option value="stake">Stake: low to high</option><option value="participants">Participants</option></select></div><div class="notice">All listed challenges and values are demo examples, not confirmed live on-chain challenges.</div><div id="challengeResults" class="challenge-grid"></div>`},
 details(){let c=this.currentChallenge(),d=this.seed(),joined=d.joined.some(x=>x.challengeId===c.id);return `<section class="detail-grid"><div><section class="panel"><span class="badge">${this.esc(c.category)}</span><h2 class="detail-title">${this.esc(c.title)}</h2><p class="muted">${this.esc(c.description)}</p><div class="detail-stats"><div class="detail-stat"><small>Duration</small><b>${c.duration} days</b></div><div class="detail-stat"><small>Stake per person</small><b>${this.money(c.stake)}</b></div><div class="detail-stat"><small>Participants · demo</small><b>${c.participants}</b></div></div><h3>Commitment rules</h3><p>${this.esc(c.requirement)}</p><h3>Evidence requirement</h3><p>${this.esc(c.evidence)}</p><h3>Created by</h3><p>${this.esc(c.creator)}</p><div class="notice">Evidence review is a prototype workflow. No external tracker, verifier, or oracle is connected.</div></section><section class="panel"><h3>How the pool works</h3><div class="steps"><div class="step"><span class="step-num">1</span><strong>Join</strong><p>Review the rules and record a demo stake.</p></div><div class="step"><span class="step-num">2</span><strong>Commit</strong><p>Make progress and submit evidence.</p></div><div class="step"><span class="step-num">3</span><strong>Verify</strong><p>Follow the displayed evidence status.</p></div><div class="step"><span class="step-num">4</span><strong>Settle</strong><p>Successful participants receive their stake back and may share eligible failed stakes.</p></div></div></section></div><aside><section class="panel"><div class="panel-head"><h3>Commitment summary</h3>${this.badge(c.status)}</div><div class="metric-list"><div class="metric-row"><span>Current pool · demo</span><b>${this.money(c.pool)}</b></div><div class="metric-row"><span>Participants</span><b>${c.participants}</b></div><div class="metric-row"><span>Start date</span><b>Demo schedule</b></div><div class="metric-row"><span>End date</span><b>${this.esc(c.end||'Not set')}</b></div><div class="metric-row"><span>Network</span><b>Monad Testnet</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><p class="small muted">By joining, you acknowledge that failed participants' stakes may be redistributed according to the final settlement rules. Demo joining does not transfer funds.</p>${joined?'<div class="notice success">You have joined this challenge in demo mode.</div><a class="btn" href="my-challenges.html" style="display:block;text-align:center">View My Challenges</a>':`<button class="btn" style="width:100%" data-action="join" data-id="${c.id}">Join Challenge · ${this.money(c.stake)}</button>`}</section></aside></section>`},
 createChallenge(){return `<section class="page-intro"><h2>Create a meaningful commitment.</h2><p>Define clear expectations and preview the maximum pool before creating a demo challenge.</p></section><form id="createForm"><div class="form-card"><h3>01 · Basic information</h3><div class="form-grid"><div class="field"><label for="cname">Challenge name</label><input id="cname" required maxlength="70" placeholder="e.g. 14-Day Design Practice"></div><div class="field"><label for="ccategory">Category</label><select id="ccategory" required><option>Health & Fitness</option><option>Learning & Productivity</option><option>Personal Goals</option></select></div><div class="field"><label for="cduration">Duration (days)</label><select id="cduration"><option>7</option><option selected>14</option><option>21</option><option>30</option></select></div><div class="field"><label for="cstart">Start date</label><input id="cstart" type="date" required></div><div class="field"><label for="cend">End date</label><input id="cend" type="date" required></div><div class="field"><label for="climit">Participant limit</label><input id="climit" type="number" min="2" max="500" value="20" required></div></div><div class="field"><label for="cdesc">Description</label><textarea id="cdesc" required placeholder="Explain the goal and what participants should expect."></textarea></div></div><div class="form-card"><h3>02 · Commitment rules</h3><div class="field"><label for="creq">Daily or periodic requirement</label><textarea id="creq" required placeholder="What should participants do?"></textarea></div><div class="field"><label for="cevidence">Evidence instructions</label><textarea id="cevidence" required placeholder="What kind of evidence can participants submit?"></textarea></div><div class="form-grid"><div class="field"><label for="cstake">Stake per participant (MON)</label><input id="cstake" type="number" min="0.01" max="1000" step="0.01" value="0.5" required></div><div class="field"><label>Maximum pool · estimate</label><input id="poolPreview" readonly value="10 MON"></div></div><div class="notice warning">Maximum pool = stake × participant limit. This is not the final pool and does not guarantee a reward. Rules not defined by the protocol remain configurable.</div><label class="checkline"><input type="checkbox" id="reviewCheck" required> I reviewed the demo challenge details and understand this will not deploy anything on-chain.</label></div><button class="btn" type="submit">Review Challenge</button></form>`},
 myChallenges(){let d=this.seed();return `<section class="page-intro"><h2>Every commitment, in one place.</h2><p>Track your joined and created challenges. Status changes here reflect demo actions only.</p></section><div class="tabs" id="myTabs"><button class="active" data-tab="All">All</button><button data-tab="Active">Active</button><button data-tab="Completed">Completed</button><button data-tab="Failed">Failed</button><button data-tab="Created">Created</button></div><div id="myChallengeList"></div>`},
 stakesPage(){let d=this.seed(),s=d.stakes;let active=s.filter(x=>x.status==='Locked').reduce((a,x)=>a+x.amount,0),returned=s.filter(x=>x.status==='Returned').reduce((a,x)=>a+x.amount,0),pending=s.filter(x=>x.status==='Pending Settlement').reduce((a,x)=>a+x.amount,0);return `${this.stats([['TOTAL STAKED',this.money(s.reduce((a,x)=>a+x.amount,0)),'All demo stake records'],['ACTIVE STAKES',this.money(active),'Currently marked locked'],['PENDING SETTLEMENT',this.money(pending),'Awaiting demo settlement'],['RETURNED STAKES',this.money(returned),'Original stakes returned']])}<section class="panel"><div class="panel-head"><h2>Stake history</h2><span class="small muted">${s.length} records</span></div>${s.length?`<div class="table-wrap"><table><thead><tr><th>Challenge</th><th>Date</th><th>Amount</th><th>Type</th><th>Status</th><th>Reference</th></tr></thead><tbody>${s.map(x=>`<tr><td>${this.esc(x.title)}</td><td>${new Date(x.date).toLocaleDateString()}</td><td>${this.money(x.amount)}</td><td>${this.esc(x.type)}</td><td>${this.badge(x.status)}</td><td class="mono">${this.esc(x.ref)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No stake records yet</b>Join a challenge to create a demo stake record.<a class="btn" href="challenges.html" style="display:inline-block;margin-top:12px">Explore Challenges</a></div>'}</section>`},
 evidencePage(){let d=this.seed();return `<section class="page-intro"><h2>Proof of progress.</h2><p>Review submissions and their explicitly simulated verification status.</p></section><div class="tabs" id="evidenceTabs"><button class="active" data-tab="All">All</button><button data-tab="Not Submitted">Not Submitted</button><button data-tab="Submitted">Submitted</button><button data-tab="Verified">Verified</button><button data-tab="Rejected">Rejected</button></div><div id="evidenceList"></div>`},
 evidenceSubmit(){let d=this.seed(),c=this.currentChallenge(),joined=d.joined;return `<section class="page-intro"><h2>Record your progress.</h2><p>Submit a demo evidence record. This does not upload to a backend or verify through an oracle.</p></section><form id="evidenceForm" class="form-card"><div class="field"><label for="eChallenge">Challenge</label><select id="eChallenge" required>${(joined.length?joined.map(x=>this.challengeById(x.challengeId)):d.challenges).map(x=>{let cc=x.challengeId?this.challengeById(x.challengeId):x;return `<option value="${cc.id}" ${cc.id===c.id?'selected':''}>${this.esc(cc.title)}</option>`}).join('')}</select></div><div class="field"><label for="eday">Day or requirement</label><input id="eday" required placeholder="e.g. Day 4 — focused coding session"></div><div class="field"><label for="edesc">Evidence description</label><textarea id="edesc" required placeholder="Briefly describe what you completed."></textarea></div><div class="field"><label for="elink">Evidence link (optional)</label><input id="elink" type="url" placeholder="https://..."></div><div class="field"><label for="efile">Optional local file (demo only)</label><input id="efile" type="file" accept="image/*,.pdf,.txt"><small class="muted">File name only is recorded in this browser. The file is not uploaded.</small></div><button class="btn" type="submit">Submit Demo Evidence</button></form>`},
 rewardsPage(){let d=this.seed(),sum=d.rewards.reduce((a,r)=>a+r.additional,0),ret=d.rewards.reduce((a,r)=>a+r.returned,0);return `${this.stats([['ORIGINAL STAKES RETURNED',this.money(ret),'Your own stake returned'],['ADDITIONAL REWARDS',this.money(sum),'Redistributed amount in demo'],['PENDING SETTLEMENT',this.money(d.stakes.filter(s=>s.status==='Pending Settlement').reduce((a,s)=>a+s.amount,0)),'Not yet settled'],['TOTAL REWARDS',this.money(sum),'Additional rewards only']])}<section class="panel"><div class="panel-head"><h2>Reward history</h2><span class="small muted">Demo ledger</span></div>${d.rewards.length?`<div class="table-wrap"><table><thead><tr><th>Challenge</th><th>Original stake</th><th>Returned stake</th><th>Additional reward</th><th>Status</th><th>Reference</th></tr></thead><tbody>${d.rewards.map(r=>`<tr><td>${this.esc(r.title)}</td><td>${this.money(r.stake)}</td><td>${this.money(r.returned)}</td><td>${this.money(r.additional)}</td><td>${this.badge(r.status)}</td><td class="mono">${this.esc(r.ref)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No rewards yet</b>Reward records appear after a demo settlement is simulated.<a class="btn" href="settlement.html" style="display:inline-block;margin-top:12px">View Settlement Example</a></div>'}<div class="notice">Returning an original stake is different from earning an additional reward. Illustrative records do not prove a real blockchain payout.</div></section>`},
 settlementPage(){let d=this.seed();let current=d.joined.find(x=>x.status==='Settlement Ready'||x.status==='Completed')||d.joined[0];return `<section class="page-intro"><h2>Understand the settlement before it happens.</h2><p>Illustrative equal redistribution example, before any applicable fees and subject to final contract rules.</p></section><div class="detail-grid"><div><section class="panel"><div class="panel-head"><h3>Illustrative pool calculation</h3>${this.badge('Demo example')}</div><div class="detail-stats"><div class="detail-stat"><small>Total pool</small><b>10 MON</b></div><div class="detail-stat"><small>Successful</small><b>6</b></div><div class="detail-stat"><small>Failed</small><b>4</b></div></div><div class="metric-list"><div class="metric-row"><span>Total participants</span><b>10</b></div><div class="metric-row"><span>Stake per participant</span><b>1 MON</b></div><div class="metric-row"><span>Successful participants' stakes returned (total)</span><b>6 MON</b></div><div class="metric-row"><span>Failed stakes available (total)</span><b>4 MON</b></div><div class="metric-row"><span>Illustrative additional reward per finisher</span><b>≈ 0.6667 MON</b></div><div class="metric-row"><span>Illustrative total per finisher</span><b>≈ 1.6667 MON</b></div></div><div class="notice warning">This is an illustrative equal-distribution calculation only. It is not confirmation that the current smart contract implements this algorithm. Fees and final contract rules may change outcomes.</div></section><section class="panel"><h3>Transaction status</h3><p class="muted small">A real settlement would require a blockchain transaction and wallet confirmation. This demo simulates interface states only.</p><div id="settleState" class="notice">Ready to simulate. No on-chain transaction has been sent.</div><div class="inline-actions"><button class="btn" data-action="settle">Simulate Settlement</button><button class="btn secondary" data-action="settleFail">Simulate Failure</button></div><div id="settleRef" class="small muted" style="margin-top:12px"></div></section></div><aside><section class="panel"><h3>Commitment settlement</h3><p class="muted small">Choose one of your joined challenges to review its demo status.</p><div class="field"><label for="settleChallenge">Challenge</label><select id="settleChallenge">${(d.joined.length?d.joined:d.challenges.map(c=>({challengeId:c.id,title:c.title,stake:c.stake,status:'Example'}))).map(x=>{let c=this.challengeById(x.challengeId);return `<option value="${c.id}">${this.esc(c.title)}</option>`}).join('')}</select></div><div class="notice">Current selection: ${current?this.esc(this.challengeById(current.challengeId).title):'Illustrative example'}</div><a class="btn secondary" href="stakes.html">View stake history</a></section></aside></div>`},
 activityPage(){let d=this.seed();return `<section class="page-intro"><h2>Your demo history.</h2><p>Actions recorded in this browser, newest first.</p></section><section class="panel">${d.activity.length?d.activity.map(a=>`<div class="activity-row"><span class="activity-icon">↗</span><div><b>${this.esc(a.title)}</b><p>${this.esc(a.desc)} · <span class="mono">${this.esc(a.ref)}</span></p></div><time>${new Date(a.time).toLocaleString()}</time></div>`).join(''):'<div class="empty">No activity yet.</div>'}</section>`},
 profilePage(){let u=this.user()||{name:'Demo User',email:'demo@example.com'},d=this.seed(),j=d.joined;return `<section class="page-intro"><h2>Your account at a glance.</h2><p>Profile information and simulated wallet state.</p></section><div class="detail-grid"><section class="panel"><div class="panel-head"><h3>Personal information</h3><span class="badge">Demo account</span></div><div class="field"><label>Name</label><input readonly value="${this.esc(u.name||'Demo User')}"></div><div class="field"><label>Email</label><input readonly value="${this.esc(u.email||'demo@example.com')}"></div><div class="field"><label>Account type</label><input readonly value="Browser-stored demo authentication"></div><div class="field"><label>Challenges joined</label><input readonly value="${j.length}"></div></section><section class="panel"><h3>Wallet</h3><div class="notice ${this.wallet()==='connected'?'success':''}">${this.wallet()==='connected'?'Simulated wallet connected':'Wallet is not connected'}</div><div class="field"><label>Wallet address</label><input id="walletAddress" readonly value="${this.wallet()==='connected'?'0x71F00000000000000000000000000000000092A4':'Not connected'}"></div><div class="field"><label>Network</label><input readonly value="Monad Testnet · Demo mode"></div><div class="inline-actions"><button class="btn" data-action="wallet">${this.wallet()==='connected'?'Disconnect demo wallet':'Connect demo wallet'}</button><button class="btn secondary" data-action="copyWallet">Copy address</button></div><div class="notice">Never enter a seed phrase or private key. This prototype does not connect to a real wallet provider.</div></section></div>`},
 settingsPage(){return `<section class="page-intro"><h2>Preferences and demo controls.</h2><p>These settings are intentionally lightweight for the prototype.</p></section><section class="panel"><h3>Notification preferences</h3><label class="checkline" style="margin:14px 0"><input type="checkbox" checked> Show in-app demo notifications</label><label class="checkline" style="margin:14px 0"><input type="checkbox" checked> Show evidence status updates</label><label class="checkline" style="margin:14px 0"><input type="checkbox"> Email notifications (coming soon)</label></section><section class="panel"><h3>Wallet and network</h3><div class="metric-list"><div class="metric-row"><span>Wallet connection</span><b>${this.wallet()==='connected'?'Connected · simulated':'Disconnected'}</b></div><div class="metric-row"><span>Network</span><b>Monad Testnet · Demo</b></div><div class="metric-row"><span>Theme</span><b>Cream & Brown</b></div></div><button class="btn secondary" data-action="network" style="margin-top:15px">Simulate network mismatch</button></section><section class="panel"><h3>Reset demo data</h3><p class="muted">Reset challenges, joined commitments, evidence, stakes, rewards, and activity so you can replay the demo.</p><button class="btn danger" data-action="reset">Reset all demo data</button></section>`},
 supportPage(){let qs=[['What is CommitmentPool?','A prototype for stake-based accountability challenges. It demonstrates the product journey using browser-side demo state.'],['How do challenges work?','Choose a challenge, review the requirement and stake, join in demo mode, and record progress through evidence submissions.'],['What happens when I join?','The prototype records a demo commitment and stake history entry. It does not move tokens.'],['What is a stake?','A commitment amount associated with participation. Actual fund handling depends on the deployed smart contract.'],['How do evidence submissions work?','You can record a description and optional link. The prototype can simulate a verification status but does not call an oracle.'],['How are successful participants rewarded?','The intended model returns successful participants’ original stakes and redistributes failed participants’ stakes according to final settlement rules.'],['What happens if I fail?','The stated model allows failed participants’ stakes to be redistributed among successful finishers. Exact handling depends on finalized contract rules.'],['Is this connected to real smart contracts?','No. This is a browser-side prototype. Wallet, stake, verification, and settlement actions are simulated and clearly labelled.'],['What is Monad Testnet?','The test network targeted by this project’s demo. This HTML prototype does not submit transactions to it.']];return `<section class="page-intro"><h2>Need a hand?</h2><p>Clear answers about commitments, evidence, settlement, and prototype limitations.</p></section><section class="panel">${qs.map((q,i)=>`<details style="padding:14px 0;border-bottom:1px solid var(--line)" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:800;font-size:13px">${this.esc(q[0])}</summary><p class="muted small" style="margin:10px 0 0">${this.esc(q[1])}</p></details>`).join('')}</section><section class="panel"><h3>Still need help?</h3><p class="muted">Support contact integration is not configured in this prototype.</p><button class="btn secondary" data-action="support">Show support status</button></section>`},

 bindPage(file){

  if(file==='evidence-submit.html'){let id=new URLSearchParams(location.search).get('id');if(id)document.getElementById('eChallenge').value=id;document.getElementById('evidenceForm').addEventListener('submit',e=>{e.preventDefault();let d=this.seed(),id=document.getElementById('eChallenge').value,c=this.challengeById(id),f=document.getElementById('efile').files[0],ev={id:++d.nextId,challengeId:id,title:c.title,requirement:document.getElementById('eday').value,description:document.getElementById('edesc').value.trim(),link:document.getElementById('elink').value.trim(),fileName:f?f.name:'',status:'Submitted',date:new Date().toISOString()};d.evidence.unshift(ev);d.activity.unshift({id:++d.nextId,title:'Evidence submitted',desc:c.title+' · '+ev.requirement,time:new Date().toISOString(),ref:'DEMO-EVIDENCE-'+d.nextId});d.notifications.unshift({title:'Evidence submitted',desc:'Your demo evidence record was saved.',read:false});this.save(d);this.modal('Evidence saved',`<div class="notice success">Your evidence record has been saved locally.</div><p><b>${this.esc(c.title)}</b></p><p>Status: ${this.badge('Submitted')}</p><p class="small muted">This is not an external verification result. The optional file was not uploaded.</p>`,`<a class="btn secondary" href="evidence.html">View Evidence</a><button class="btn" id="backMy">My Challenges</button>`);document.getElementById('backMy').onclick=()=>location.href='my-challenges.html'})}
 },
 joinFlow(id){let d=this.seed(),c=this.challengeById(id);if(d.joined.some(j=>j.challengeId===id))return this.toast('You have already joined this demo challenge.');if(this.wallet()!=='connected')return this.modal('Connect your demo wallet first','<p>Wallet connection is simulated in this prototype. No provider or private key is required.</p>',`<button class="btn secondary" data-close>Cancel</button><button class="btn" id="connectThenJoin">Connect Demo Wallet</button>`),void(document.getElementById('connectThenJoin').onclick=()=>{localStorage.setItem(this.keys.wallet,'connected');this.closeModal();this.joinFlow(id)});this.modal('Confirm demo commitment',`<div class="metric-list"><div class="metric-row"><span>Challenge</span><b>${this.esc(c.title)}</b></div><div class="metric-row"><span>Required stake</span><b>${this.money(c.stake)}</b></div><div class="metric-row"><span>Wallet</span><b class="mono">0x71F...92A4</b></div><div class="metric-row"><span>Network</span><b>Monad Testnet · Demo</b></div><div class="metric-row"><span>Estimated fee</span><b>Not calculated</b></div></div><div class="notice warning">Demo only: confirming records a local state change. No funds are transferred and no blockchain transaction is sent.</div><label class="checkline"><input type="checkbox" id="joinAgree"> I understand failed participants' stakes may be redistributed under the final settlement rules.</label>`,`<button class="btn secondary" data-close>Cancel</button><button class="btn" id="confirmJoin">Confirm Demo Join</button>`);document.getElementById('confirmJoin').onclick=()=>{if(!document.getElementById('joinAgree').checked)return this.toast('Please acknowledge the staking disclaimer.');let dd=this.seed(),join={id:++dd.nextId,challengeId:id,stake:c.stake,status:'Active',progress:0,date:new Date().toISOString()};dd.joined.unshift(join);dd.stakes.unshift({id:++dd.nextId,challengeId:id,title:c.title,date:new Date().toISOString(),amount:c.stake,type:'Demo stake',status:'Locked',ref:'DEMO-STAKE-'+dd.nextId});dd.activity.unshift({id:++dd.nextId,title:'Challenge joined',desc:'Joined '+c.title+' in demo mode.',time:new Date().toISOString(),ref:'DEMO-JOIN-'+dd.nextId});dd.notifications.unshift({title:'Challenge joined',desc:'Your demo commitment is now in My Challenges.',read:false});c.participants++;c.pool+=c.stake;this.save(dd);this.closeModal();this.modal('Demo commitment recorded',`<div class="notice success">You joined <b>${this.esc(c.title)}</b>.</div><p>Demo stake record: ${this.money(c.stake)}</p><p class="small muted">No on-chain transaction occurred.</p>`,`<a class="btn secondary" href="stakes.html">View My Stakes</a><a class="btn" href="my-challenges.html">My Challenges</a>`) }},
 simulateSettlement(fail){let d=this.seed(),sel=document.getElementById('settleChallenge')?.value,join=d.joined.find(j=>j.challengeId===(sel||d.joined[0]?.challengeId));if(fail){let state=document.getElementById('settleState');if(state){state.className='notice warning';state.textContent='Failed (simulated). No transaction was submitted; no stake or reward record changed.'}return}if(!join){let state=document.getElementById('settleState');if(state){state.className='notice warning';state.textContent='No joined challenge selected. This remains an illustrative calculation only.'}return}if(join.status==='Completed'){this.toast('This demo challenge has already been settled.');return}let c=this.challengeById(join.challengeId);this.modal('Simulate settlement?',`<div class="notice warning">This will mark the selected demo commitment as settled locally. It does not submit a blockchain transaction.</div><p><b>${this.esc(c.title)}</b></p><p>Original stake to return: ${this.money(join.stake)}</p><p>Additional reward: illustrative only; not calculated for this challenge.</p>`,`<button class="btn secondary" data-close>Cancel</button><button class="btn" id="confirmSettlement">Confirm demo settlement</button>`);document.getElementById('confirmSettlement').onclick=()=>{let dd=this.seed(),j=dd.joined.find(x=>x.id===join.id);if(!j)return;j.status='Completed';let st=dd.stakes.find(s=>s.challengeId===j.challengeId&&s.status==='Locked');if(st)st.status='Returned';dd.rewards.unshift({id:++dd.nextId,title:c.title,stake:j.stake,returned:j.stake,additional:0,status:'Settled (demo)',ref:'DEMO-SETTLEMENT-'+dd.nextId});dd.activity.unshift({id:++dd.nextId,title:'Settlement simulated',desc:c.title+' original stake marked returned in demo ledger.',time:new Date().toISOString(),ref:'DEMO-SETTLEMENT-'+dd.nextId});dd.notifications.unshift({title:'Settlement simulated',desc:'Demo settlement record added. No on-chain payout occurred.',read:false});this.save(dd);this.closeModal();let state=document.getElementById('settleState');if(state){state.className='notice success';state.textContent='Confirmed (demo). The local UI state changed; no blockchain transaction occurred.'}let ref=document.getElementById('settleRef');if(ref)ref.textContent='Demo reference: DEMO-SETTLEMENT-'+dd.nextId;this.toast('Demo settlement recorded.');}}
};
document.addEventListener('DOMContentLoaded',()=>CP.render());

document.addEventListener('click',e=>{
 if(e.target?.id==='switchNetwork'){CP.closeModal();CP.toast('Network switched in demo UI only.');}
 if(e.target?.id==='confirmReset'){localStorage.removeItem(CP.keys.data);localStorage.removeItem(CP.keys.wallet);CP.seed();CP.closeModal();CP.toast('Demo data reset.');setTimeout(()=>location.href='dashboard.html',450);}
});
</script>

<script>
// Quick auth guard — redirect to login if session is missing
// Skipped if App ID is not configured (allows demo mode)
(async function() {
  if (!window.CP_CONFIG || window.CP_CONFIG.privyAppId === 'YOUR_PRIVY_APP_ID') return;
  let attempts = 0;
  while (!window.PrivyAuth && attempts < 60) {
    await new Promise(r => setTimeout(r, 100));
    attempts++;
  }
  if (!window.PrivyAuth) return;
  try {
    await PrivyAuth.initPrivy();
    const state = await PrivyAuth.getAuthState();
    if (!state.authenticated) {
      location.href = 'login.html';
    }
  } catch (e) {
    console.warn('[Auth guard]', e.message);
  }
})();
</script></body>
